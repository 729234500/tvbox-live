name: 每日更新可用 TVBox 源

on:
  schedule:
    # UTC 19:30 = 北京时间 03:30，每天一次
    - cron: "30 19 * * *"
  workflow_dispatch:            # 支持手动点一下立即跑
  push:
    branches: [main]
    paths:                      # 改了源清单/脚本就顺手重跑
      - "sources.json"
      - "scripts/build.py"
      - "scripts/merge_iptv.py"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: tvbox-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 抓取并实测源
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/build.py

      # 把 iptv-api 每天生成的最新直播结果并进来。
      # continue-on-error：这一步挂掉不影响上面 build.py 的产物照常提交。
      - name: 合并 iptv-api 每日直播源
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/merge_iptv.py

      - name: 提交产物
        run: |
          git config user.name "tvbox-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "本次无变化，跳过提交"
            exit 0
          fi
          git commit -m "chore: 自动更新可用源 $(date -u '+%Y-%m-%d %H:%M UTC')"
          # 构建要跑十几分钟，期间可能有人手动推了 commit，直接 push 会因
          # non-fast-forward 被拒。先 rebase 再推，最多重试 3 次。
          for i in 1 2 3; do
            if git pull --rebase --autostash origin main && git push; then
              echo "推送成功（第 $i 次尝试）"
              exit 0
            fi
            echo "推送失败，第 $i 次，5 秒后重试…"
            sleep 5
          done
          echo "!! 连续 3 次推送失败，产物留在本次运行里，请手动 Run workflow 重跑"
          exit 1
